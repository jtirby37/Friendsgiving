<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendsgiving — Public Board</title><link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/style.css"><style>
body{padding:2rem}.tv{max-width:1500px;margin:auto}.tv h1{text-align:center;color:var(--gold);font-size:clamp(2rem,5vw,4rem)}.tvgrid{display:grid;gap:8px}.tvcat,.tvcell{background:var(--cell);border-radius:10px;padding:1rem;text-align:center;font-weight:700}.tvcat{color:var(--gold);font-size:clamp(1rem,2vw,1.8rem);min-height:90px;display:grid;place-items:center}.tvcell{font-family:var(--display);color:var(--gold);font-size:clamp(1.5rem,3vw,3rem);min-height:90px}.tvcell.used{opacity:.12}.scores{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin:2rem 0}.score{background:var(--cell);padding:1rem 2rem;border-radius:12px;text-align:center}.score b{display:block;color:var(--gold);font-size:2rem}.cluebox{text-align:center;margin:3rem auto;max-width:1100px}.cluebox .question{font-size:clamp(2rem,5vw,4rem);font-weight:700}.cluebox .answer{font-size:clamp(1.5rem,3vw,2.5rem);color:var(--gold);margin-top:2rem}.subtle{color:var(--dim);text-align:center}
.feudgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}.feudslot{display:grid;grid-template-columns:2rem 1fr 3rem;align-items:center;font-size:clamp(1rem,2.5vw,2rem)}.feudresults{width:100%;border-collapse:collapse;font-size:clamp(1rem,2vw,1.6rem)}.feudresults td,.feudresults th{padding:1rem;border-bottom:1px solid var(--dim)}
</style></head><body><main class="tv"><h1>Friendsgiving</h1><div id="screen" class="subtle">Enter a room code in the URL to connect…</div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="../assets/firebase-config.js"></script><script src="board.js"></script></body></html>
